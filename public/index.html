<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denver 感恩节之旅 · 选房 + 分账</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .card-img { aspect-ratio: 16/10; object-fit: cover; }
  .chip { display:inline-block; background:#eef2ff; color:#4f46e5; font-size:12px; padding:2px 8px; border-radius:9999px; margin:2px 2px 0 0; }
  .filter-chip { cursor:pointer; }
  .filter-chip.active { background:#4f46e5; color:#fff; }
  #nameModal { display:none; }
  #nameModal.open { display:flex; }
  .vote-btn.voted { background:#e11d48 !important; color:#fff !important; border-color:#e11d48 !important; }
  .carousel { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; }
  .carousel::-webkit-scrollbar { display:none; }
  .carousel > img { flex:0 0 100%; width:100%; scroll-snap-align:start; }
  .car-dots { position:absolute; left:0; right:0; bottom:10px; display:flex; justify-content:center; gap:6px; pointer-events:none; }
  .car-dots button { width:7px; height:7px; border-radius:9999px; background:rgba(255,255,255,.55); box-shadow:0 0 2px rgba(0,0,0,.4); pointer-events:auto; transition:transform .2s, background .2s; }
  .car-dots button.on { background:#fff; transform:scale(1.3); }
  .car-arrow { position:absolute; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:9999px; background:rgba(255,255,255,.9); color:#334155; font-size:18px; line-height:30px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.25); opacity:0; transition:opacity .2s; }
  .car-wrap:hover .car-arrow:not([disabled]) { opacity:1; }
  .car-arrow[disabled] { visibility:hidden; }
  @media (hover:none) { .car-arrow { display:none; } }
  /* 地图：自成一个层叠上下文，免得 Leaflet 的高 z-index 盖住弹窗和底栏 */
  #mapBox { position:relative; z-index:0; isolation:isolate; }
  #map { height:340px; }
  @media (min-width:768px) { #map { height:420px; } }
  .pin-wrap { background:none; border:none; }
  .osm-tiles { filter: saturate(.75) contrast(.95) brightness(1.03); } /* 柔和一点，让价格钉更显眼 */
  .pin { position:absolute; left:0; bottom:0; transform:translate(-50%, -6px); white-space:nowrap; background:#fff; color:#0f172a; font-weight:800; font-size:12px; padding:4px 9px; border-radius:9999px; box-shadow:0 2px 8px rgba(15,23,42,.28); transition: transform .15s, background .15s, color .15s; cursor:pointer; }
  .pin::after { content:''; position:absolute; left:50%; bottom:-5px; transform:translateX(-50%); border:5px solid transparent; border-bottom:0; border-top-color:inherit; }
  .pin { border-top-color:#fff; }
  .pin .pin-votes { color:#e11d48; font-weight:700; margin-left:4px; }
  .pin.mine { background:#e11d48; color:#fff; border-top-color:#e11d48; }
  .pin.mine .pin-votes { color:#ffe4e6; }
  .pin.hot, .pin:hover { background:#1e1b4b; color:#fff; border-top-color:#1e1b4b; transform:translate(-50%, -6px) scale(1.12); z-index:1000; }
  .pin.hot .pin-votes, .pin:hover .pin-votes { color:#f9a8d4; }
  .leaflet-popup-content-wrapper { border-radius:16px; padding:0; overflow:hidden; }
  .leaflet-popup-content { margin:0; width:230px !important; }
  .flash { animation: flash 1.4s ease; }
  @keyframes flash { 0%,100% { box-shadow: 0 1px 3px rgba(0,0,0,.1); } 30% { box-shadow: 0 0 0 4px #818cf8, 0 12px 30px -6px rgba(79,70,229,.45); } }
  .just-voted { box-shadow: 0 0 0 3px #fb7185, 0 10px 25px -5px rgba(225,29,72,.35); transition: box-shadow .6s ease; }
  .avatar { display:grid; place-items:center; border-radius:9999px; font-weight:800; color:#fff; background:linear-gradient(135deg,#6366f1,#ec4899); }
  #accountBtn { position:fixed; z-index:45; top:calc(env(safe-area-inset-top, 0px) + 14px); right:16px; }
  @media (max-width: 767px) { header h1 { padding-right: 6rem; } }
  .trip-tab { background:rgba(255,255,255,.15); color:#fff; }
  .trip-tab:hover { background:rgba(255,255,255,.28); }
  .trip-tab.active { background:#fff; color:#4f46e5; box-shadow:0 4px 14px rgba(0,0,0,.15); }
  #toast { position:fixed; left:50%; top:24px; z-index:70; pointer-events:none; opacity:0; transform:translate(-50%,-16px) scale(.9);
    transition: opacity .3s ease, transform .45s cubic-bezier(.2,1.6,.4,1); }
  #toast.show { opacity:1; transform:translate(-50%,0) scale(1); }
  @keyframes vote-pop { 0% { transform:scale(1); } 35% { transform:scale(1.12); } 100% { transform:scale(1); } }
  .vote-pop { animation: vote-pop .45s ease; }

  /* 左侧导航 */
  #sidebar { background: radial-gradient(120% 60% at 0% 0%, rgba(236,72,153,.35), transparent 60%), linear-gradient(180deg, #1e1b4b 0%, #312e81 55%, #4c1d95 100%); }
  .nav-item { position:relative; display:flex; align-items:center; gap:.85rem; width:100%; padding:.8rem 1rem; border-radius:1rem; color:rgba(224,231,255,.75); text-align:left; transition: background .2s, color .2s, transform .2s; }
  .nav-item:hover { background:rgba(255,255,255,.08); color:#fff; }
  .nav-item .nav-ico { display:grid; place-items:center; width:2.4rem; height:2.4rem; border-radius:.8rem; background:rgba(255,255,255,.08); font-size:1.15rem; transition: background .2s, transform .2s; }
  .nav-item:hover .nav-ico { transform: rotate(-6deg) scale(1.06); }
  .nav-item.active { background:#fff; color:#1e1b4b; box-shadow:0 10px 30px -8px rgba(0,0,0,.45); }
  .nav-item.active .nav-ico { background:linear-gradient(135deg,#6366f1,#ec4899); }
  .nav-item.active::before { content:''; position:absolute; left:-1rem; top:22%; bottom:22%; width:4px; border-radius:0 4px 4px 0; background:linear-gradient(#a5b4fc,#f9a8d4); }
  .nav-sub { display:block; font-size:.72rem; font-weight:500; opacity:.65; }
  /* 手机上变成底部标签栏 */
  #bottomNav { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bnav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:.55rem 0 .5rem; font-size:.72rem; font-weight:600; color:#64748b; }
  .bnav-item .nav-ico { font-size:1.3rem; transition: transform .2s; }
  .bnav-item.active { color:#4f46e5; }
  .bnav-item.active .nav-ico { transform: translateY(-2px) scale(1.12); }
  .view-enter { animation: view-in .35s ease; }
  @keyframes view-in { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .view-enter { animation:none; } }
</style>
</head>
<body class="bg-slate-100 min-h-screen md:flex">

<!-- 左侧导航（md 以上） -->
<aside id="sidebar" class="hidden md:flex flex-col w-64 shrink-0 h-screen sticky top-0 text-white px-4 py-6">
  <div class="px-2 mb-8">
    <div class="text-3xl mb-2">🦃</div>
    <div class="font-extrabold text-lg leading-tight">Denver 感恩节之旅</div>
    <div class="text-xs text-indigo-200 mt-1">Thanksgiving 2026 · 大家一起</div>
  </div>
  <nav class="flex flex-col gap-2" aria-label="主导航">
    <button data-view="hunt" class="nav-item"><span class="nav-ico">🏠</span><span class="font-bold">AirBnb hunting<span class="nav-sub">一起选房 · 投票</span></span></button>
    <button data-view="split" class="nav-item"><span class="nav-ico">💰</span><span class="font-bold">Split that bill<span class="nav-sub">分账 · 谁该给谁</span></span></button>
  </nav>
  <p class="mt-auto px-2 text-xs text-indigo-200/80 leading-relaxed">有链接的人都能加房源、投票、记账 · 数据实时共享</p>
</aside>

<!-- 手机底部标签栏 -->
<nav id="bottomNav" class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur border-t border-slate-200 flex" aria-label="主导航">
  <button data-view="hunt" class="bnav-item"><span class="nav-ico">🏠</span>AirBnb hunting</button>
  <button data-view="split" class="bnav-item"><span class="nav-ico">💰</span>Split that bill</button>
</nav>

<div class="flex-1 min-w-0 pb-20 md:pb-0">
<header class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white px-6 py-8">
  <div class="max-w-6xl mx-auto">
    <h1 id="viewTitle" class="text-2xl md:text-3xl font-bold">&nbsp;</h1>
    <p id="tripSub" class="mt-2 text-indigo-100">&nbsp;</p>
    <nav id="tabs" class="mt-5 flex flex-wrap gap-2"></nav>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">

  <div id="view-hunt">
  <!-- 加房源 -->
  <section class="bg-white rounded-2xl shadow p-5 mb-6">
    <h2 class="font-bold text-lg mb-3">➕ 添加候选房源</h2>
    <div class="flex flex-col md:flex-row gap-3">
      <input id="urlInput" type="url" placeholder="粘贴 Airbnb 房源链接，例如 https://www.airbnb.com/rooms/123456…"
        class="flex-1 border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button id="addBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl px-6 py-3">加入清单</button>
    </div>
    <p id="addMsg" class="text-sm mt-2 text-slate-500"></p>
    <details id="manualBox" class="mt-3 text-sm">
      <summary class="cursor-pointer text-indigo-600 font-medium">自动抓取失败？点这里手动添加</summary>
      <div class="grid md:grid-cols-2 gap-3 mt-3">
        <input id="mUrl" class="border rounded-lg px-3 py-2" placeholder="房源链接 *">
        <input id="mTitle" class="border rounded-lg px-3 py-2" placeholder="房源标题 *">
        <input id="mImage" class="border rounded-lg px-3 py-2" placeholder="照片链接（可选）">
        <input id="mPrice" class="border rounded-lg px-3 py-2" type="number" placeholder="总价 USD（可选）">
        <input id="mBedrooms" class="border rounded-lg px-3 py-2" type="number" placeholder="卧室数">
        <input id="mBeds" class="border rounded-lg px-3 py-2" type="number" placeholder="床位数">
        <input id="mBaths" class="border rounded-lg px-3 py-2" placeholder="浴室数（可填 2.5）">
        <input id="mSleeps" class="border rounded-lg px-3 py-2" type="number" placeholder="可住人数">
        <select id="mArea" class="border rounded-lg px-3 py-2"></select>
        <input id="mNote" class="border rounded-lg px-3 py-2" placeholder="一句话亮点（可选）">
      </div>
      <button id="manualBtn" class="mt-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl px-5 py-2">手动加入</button>
    </details>
  </section>

  <!-- 工具条 -->
  <section class="flex flex-wrap items-center gap-2 mb-4">
    <div id="filters" class="contents"></div>
    <select id="sortSel" class="ml-auto border rounded-full px-4 py-1.5 text-sm bg-white">
      <option value="votes">按票数排序</option>
      <option value="price">按价格从低到高</option>
    </select>
    <button id="mapToggle" class="border rounded-full px-4 py-1.5 text-sm bg-white hover:border-indigo-400"></button>
    <span id="countLbl" class="text-sm text-slate-500 w-full md:w-auto"></span>
  </section>

  <!-- 地图 -->
  <section id="mapBox" class="bg-white rounded-2xl shadow overflow-hidden mb-5">
    <div id="map"></div>
    <div id="mapNote" class="absolute left-3 bottom-3 z-[1000] bg-white/90 backdrop-blur text-xs text-slate-600 rounded-full px-3 py-1 shadow" hidden></div>
  </section>

  <!-- 列表 -->
  <section id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-5"></section>
  </div>

  <!-- 分账 Splitwise -->
  <div id="view-split" hidden>
  <section id="splitSection" class="bg-white rounded-2xl shadow p-5">
    <div class="mb-5">
      <div class="text-sm font-medium mb-2">成员</div>
      <div id="memberChips" class="mb-2"></div>
      <div class="flex gap-2">
        <input id="memberInput" class="border rounded-lg px-3 py-2 flex-1" placeholder="新成员的名字" maxlength="20">
        <button id="memberBtn" class="bg-slate-800 hover:bg-slate-900 text-white rounded-xl px-4 py-2 text-sm font-bold">加成员</button>
      </div>
    </div>
    <div class="grid md:grid-cols-3 gap-3 mb-3">
      <input id="eDesc" class="border rounded-lg px-3 py-2" placeholder="支出说明，比如 房费 / 晚餐">
      <input id="eAmount" type="number" step="0.01" min="0" class="border rounded-lg px-3 py-2" placeholder="金额 USD">
      <select id="ePaidBy" class="border rounded-lg px-3 py-2"></select>
    </div>
    <div class="mb-3">
      <div class="text-sm font-medium mb-1">分摊给（默认全选）</div>
      <div id="eSplit"></div>
    </div>
    <button id="eAddBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl px-5 py-2">记一笔</button>
    <button id="eCancelBtn" class="hidden border-2 border-slate-200 hover:border-slate-400 text-slate-600 rounded-xl px-5 py-1.5 ml-2">取消</button>
    <p id="eMsg" class="text-sm mt-2 text-slate-500"></p>
    <div id="balances" class="mt-5"></div>
    <div id="settlements" class="mt-3"></div>
    <div id="expenses" class="mt-4"></div>
  </section>
  </div>

  <p class="md:hidden text-center text-slate-400 text-sm mt-10 mb-6">有链接的人都能加房源、投票、记账 · 数据实时共享</p>
</main>
</div>

<!-- 名字弹窗 -->
<!-- 当前用户（点开可以切换） -->
<button id="accountBtn" class="account-btn flex items-center gap-2 rounded-full bg-white/90 backdrop-blur shadow-lg hover:shadow-xl pl-1 pr-3 py-1 text-sm font-medium text-slate-700"></button>

<!-- 投票成功的庆祝横幅 -->
<div id="toast" role="status" aria-live="polite" class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white font-bold rounded-full px-6 py-3 shadow-xl max-w-[90vw] truncate"></div>

<div id="nameModal" class="fixed inset-0 bg-black/50 items-center justify-center z-50 px-4">
  <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
    <h3 class="font-bold text-lg mb-1">👋 你是谁？</h3>
    <p class="text-sm text-slate-500 mb-4">选一下你的名字就能登录，投票和记账都会记在你名下</p>
    <div id="pickBox">
      <label class="text-sm font-medium" for="userSel">我来过了</label>
      <div class="flex gap-2 mt-1 mb-4">
        <select id="userSel" class="flex-1 min-w-0 border rounded-lg px-3 py-2 bg-white"></select>
        <button id="pickOk" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl px-4 py-2 font-bold">登录</button>
      </div>
      <div class="flex items-center gap-3 text-xs text-slate-400 mb-3"><span class="flex-1 border-t"></span>第一次来？<span class="flex-1 border-t"></span></div>
    </div>
    <div class="flex gap-2">
      <input id="nameInput" class="flex-1 min-w-0 border rounded-lg px-3 py-2" placeholder="输入你的名字，比如 Ken" maxlength="20">
      <button id="nameOk" class="bg-slate-800 hover:bg-slate-900 text-white rounded-xl px-4 py-2 font-bold">加入</button>
    </div>
    <p id="loginMsg" class="text-sm text-rose-600 mt-2"></p>
    <button id="loginSkip" class="mt-2 text-sm text-slate-400 hover:text-slate-600">先随便看看 →</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
// 两段行程，各自一份候选清单（后端按 trip 分开存）
const TRIPS = {
  nov25: { date: '11月25–26', people: 9, nights: 1, checkIn: '2026-11-25', checkOut: '2026-11-26', areas: ['Denver 市区', 'Denver 周边'] },
  nov26: { date: '11月26–29', people: 14, nights: 3, checkIn: '2026-11-26', checkOut: '2026-11-29', areas: ['大沙丘区域', '落基山 · Estes Park'] },
};
const [hashTrip, hashView] = location.hash.slice(1).split('/');
let trip = TRIPS[hashTrip] ? hashTrip : 'nov25';
// 左侧导航的两个页面
const VIEWS = {
  hunt:  { title: '🏠 AirBnb hunting · 一起选房', sub: '看中哪间就把 Airbnb 链接贴进来，票数最高的我们就订它' },
  split: { title: '💰 Split that bill · 分账', sub: '全员一本账 · 共同支出记在这里，自动算清谁该给谁多少钱' },
};
let view = VIEWS[hashView] ? hashView : 'hunt';
function syncHash(){ history.replaceState(null, '', '#' + trip + (view === 'hunt' ? '' : '/' + view)); }
let T = TRIPS[trip];
let STATE = { listings: [], expenses: [], balances: {}, settlements: [] };
let myToken = localStorage.getItem('vt');
if (!myToken) { myToken = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); localStorage.setItem('vt', myToken); }
let myName = localStorage.getItem('vn') || '';
let filter = 'all', sortBy = 'votes';
let editingId = null, addDraft = null; // 分账里正在修改的那笔；addDraft 是点修改前表单里没记完的新支出，改完放回去
let pendingVoteId = null;

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(path, method, body){
  const r = await fetch(path, { method: method || 'GET', headers: {'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

function statsLine(l){
  const parts = [];
  if (l.bedrooms) parts.push(l.bedrooms + '卧');
  if (l.beds) parts.push(l.beds + '床');
  if (l.bathrooms) parts.push(l.bathrooms + '卫');
  if (l.sleeps) parts.push('可住' + l.sleeps + '人');
  return parts.length ? parts.join(' · ') : '户型信息待补充';
}

// 按当前行程的日期和人数打开 Airbnb，直接看到实时总价
function airbnbLink(l){
  return 'https://www.airbnb.com/rooms/' + l.roomId + '?adults=' + T.people + '&check_in=' + T.checkIn + '&check_out=' + T.checkOut;
}

function card(l){
  const voted = (l.votes || []).some(v => v.token === myToken);
  const n = (l.votes || []).length;
  const voters = (l.votes || []).map(v => '<span class="chip">' + esc(v.name || '匿名') + '</span>').join('');
  // 早期预置房源没有 priceNights，它们的价格是 11/25–29 的 4 晚总价
  const price = l.priceUSD ? '<div class="text-lg font-bold text-slate-800">约 $' + Number(l.priceUSD).toLocaleString() + ' <span class="text-xs font-normal text-slate-500">/ ' + (l.priceNights || 4) + '晚含税费</span></div>'
    : '<div class="text-sm text-slate-500">价格以 Airbnb 页面为准</div>';
  const tooSmall = l.sleeps && l.sleeps < T.people ? '<p class="text-sm text-amber-600 mb-2">⚠️ 最多住 ' + l.sleeps + ' 人，不够 ' + T.people + ' 人</p>' : '';
  const rating = l.rating ? '<span class="text-sm">⭐ ' + l.rating + (l.reviews ? '（' + l.reviews + '条评价）' : '') + '</span>' : '';
  const area = l.area ? '<span class="absolute top-3 left-3 bg-black/60 text-white text-xs px-2 py-1 rounded-full">' + esc(l.area) + '</span>' : '';
  const del = '<button onclick="removeListing(\'' + l.id + '\')" title="删除这个房源" class="absolute top-3 right-3 bg-black/60 hover:bg-red-600 text-white text-xs px-2 py-1 rounded-full">✕</button>';
  const pics = (l.images && l.images.length) ? l.images : (l.image ? [l.image] : []);
  let img;
  if (!pics.length) img = '<div class="card-img w-full rounded-t-2xl bg-slate-200 flex items-center justify-center text-slate-400 text-4xl">🏠</div>';
  else if (pics.length === 1) img = '<img src="' + esc(pics[0]) + '" class="card-img w-full rounded-t-2xl" loading="lazy" alt="">';
  else img = '<div class="carousel rounded-t-2xl" onscroll="carSync(this)">'
      + pics.map(u => '<img src="' + esc(u) + '" class="card-img" loading="lazy" alt="">').join('') + '</div>'
      + '<button class="car-arrow left-2" onclick="carStep(this,-1)" aria-label="上一张" disabled>‹</button>'
      + '<button class="car-arrow right-2" onclick="carStep(this,1)" aria-label="下一张">›</button>'
      + '<div class="car-dots">' + pics.map((_, i) => '<button onclick="carGo(this,' + i + ')" aria-label="第' + (i + 1) + '张"' + (i ? '' : ' class="on"') + '></button>').join('') + '</div>';
  return '<article data-id="' + esc(l.id) + '" class="bg-white rounded-2xl shadow overflow-hidden flex flex-col">'
    + '<div class="relative car-wrap">' + img + area + del + '</div>'
    + '<div class="p-4 flex flex-col flex-1">'
    + '<h3 class="font-bold leading-snug mb-1">' + esc(l.title || '未命名房源') + '</h3>'

// ---- photo carousel ----
const slideIdx = {}; // listing id -> current photo, so re-renders keep your place
function carOf(el){ return el.closest('.car-wrap').querySelector('.carousel'); }
function carSync(c){
  const i = Math.round(c.scrollLeft / c.clientWidth);
  const wrap = c.closest('.car-wrap');
  wrap.querySelectorAll('.car-dots button').forEach((d, k) => d.classList.toggle('on', k === i));
  const [prev, next] = wrap.querySelectorAll('.car-arrow');
  prev.disabled = i <= 0; next.disabled = i >= c.children.length - 1;
  const art = c.closest('article'); if (art) slideIdx[art.dataset.id] = i;
}
function carGo(el, i){ const c = carOf(el); c.scrollTo({ left: i * c.clientWidth, behavior: reduceMotion ? 'auto' : 'smooth' }); }
function carStep(el, d){ const c = carOf(el); carGo(el, Math.round(c.scrollLeft / c.clientWidth) + d); }
function restoreSlides(root){
  root.querySelectorAll('article[data-id] .carousel').forEach(c => {
    const i = slideIdx[c.closest('article').dataset.id];
    if (i) { c.scrollLeft = i * c.clientWidth; carSync(c); }
  });
}

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let reorderTimer = null;

// ---------- 地图：当前筛选下的房源都钉在上面 ----------
let map = null, mapLayer = null, mapKey = '', mapList = [];
const pinById = {};
let showMap = true;
try { showMap = localStorage.getItem('showMap') !== '0'; } catch(e){}
function mapVisible(){ return showMap && view === 'hunt' && window.L; }
function ensureMap(){
  if (map || !window.L) return map;
  map = L.map('map', { scrollWheelZoom: false, zoomControl: true, attributionControl: true, zoomSnap: 0.25 });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, className: 'osm-tiles',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  map.setView([39.2, -105.3], 7); // 科罗拉多中部，等房源坐标来了再缩放
  map.on('click', () => map.scrollWheelZoom.enable()); // 点一下地图之后才允许滚轮缩放，免得滚页面时误缩放
  map.on('mouseout', () => map.scrollWheelZoom.disable());
  mapLayer = L.layerGroup().addTo(map);
  return map;
}
function pinHtml(l){
  const n = (l.votes || []).length;
  const mine = (l.votes || []).some(v => v.token === myToken);
  const label = l.priceUSD ? '$' + Number(l.priceUSD).toLocaleString() : '🏠';
  return '<div class="pin' + (mine ? ' mine' : '') + '" data-id="' + esc(l.id) + '">' + label + (n ? '<span class="pin-votes">♥' + n + '</span>' : '') + '</div>';
}
function popupHtml(l){
  const pic = (l.images && l.images[0]) || l.image;
  const n = (l.votes || []).length;
  return (pic ? '<img src="' + esc(pic) + '" style="width:100%;aspect-ratio:16/10;object-fit:cover" alt="">' : '')
    + '<div style="padding:10px 12px 12px"><div style="font-weight:700;line-height:1.3;margin-bottom:4px">' + esc(l.title || '未命名房源') + '</div>'
    + '<div style="color:#64748b;font-size:12px;margin-bottom:8px">' + esc(statsLine(l)) + (n ? ' · ♥ ' + n + ' 票' : '') + '</div>'
    + '<button onclick="focusCard(\'' + l.id + '\')" style="width:100%;background:#4f46e5;color:#fff;font-weight:700;border-radius:10px;padding:6px 0">看这间 ↓</button></div>';
}
function renderMap(list){
  mapList = list;
  $('#mapBox').hidden = !showMap;
  $('#mapToggle').textContent = showMap ? '🗺️ 隐藏地图' : '🗺️ 显示地图';
  if (!mapVisible() || !ensureMap()) return;
  mapLayer.clearLayers();
  Object.keys(pinById).forEach(k => delete pinById[k]);
  const pts = [];
  list.forEach(l => {
    if (l.lat == null || l.lng == null) return;
    const m = L.marker([l.lat, l.lng], { icon: L.divIcon({ className: 'pin-wrap', html: pinHtml(l), iconSize: [0, 0] }), riseOnHover: true })
      .bindPopup(popupHtml(l), { maxWidth: 240, minWidth: 230, closeButton: true, autoPanPadding: [20, 20] })
      .addTo(mapLayer);
    pinById[l.id] = m;
    pts.push([l.lat, l.lng]);
  });
  const missing = list.length - pts.length;
  $('#mapNote').hidden = !missing;
  $('#mapNote').textContent = missing + ' 间还在获取位置…';
  // 只有房源集合变了（换行程/筛选/新加房源）才重新取景，投票重排不动地图
  const key = trip + '|' + filter + '|' + list.map(l => l.id + (l.lat != null ? '@' : '')).sort().join(',');
  if (key !== mapKey) {
    mapKey = key;
    map.invalidateSize();
    // 不做动画：坐标是一间间陆续到的，连续的缩放动画会互相打断，停在半路
    if (pts.length === 1) map.setView(pts[0], 12, { animate: false });
    else if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 13, animate: false });
  }
}
function setHot(id, on){
  const m = pinById[id];
  const el = m && m.getElement() && m.getElement().querySelector('.pin');
  if (!el) return;
  el.classList.toggle('hot', on);
  m.setZIndexOffset(on ? 1000 : 0);
}
function focusCard(id){
  const el = $('#grid').querySelector('article[data-id="' + CSS.escape(id) + '"]');
  if (!el) return;
  el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function toggleMap(){
  showMap = !showMap;
  try { localStorage.setItem('showMap', showMap ? '1' : '0'); } catch(e){}
  mapKey = '';
  renderMap(mapList);
}

// Re-render the grid. Cards that change position glide to their new spot (FLIP).
// If anchorId is given, the page scrolls so that card stays where it was on screen.
function render(anchorId){
  if (reorderTimer) { clearTimeout(reorderTimer); reorderTimer = null; }
  const grid = $('#grid');
  const before = {};
  grid.querySelectorAll('article[data-id]').forEach(el => { before[el.dataset.id] = el.getBoundingClientRect(); });
  let list = STATE.listings.slice();
  if (filter !== 'all') list = list.filter(l => l.area === filter);
  if (sortBy === 'votes') list.sort((a,b) => (b.votes||[]).length - (a.votes||[]).length || (a.priceUSD||1e9) - (b.priceUSD||1e9));
  else list.sort((a,b) => (a.priceUSD||1e9) - (b.priceUSD||1e9));
  grid.innerHTML = list.length ? list.map(card).join('') : '<p class="text-slate-400 col-span-full text-center py-10">' + (filter === 'all' ? '还没有候选' : '这个区域还没有候选') + '，贴个 Airbnb 链接进来吧 👆</p>';
  $('#countLbl').textContent = '共 ' + STATE.listings.length + ' 间候选';
  restoreSlides(grid);
  renderMap(list);

  const anchorEl = anchorId && grid.querySelector('article[data-id="' + CSS.escape(anchorId) + '"]');
  if (anchorEl && before[anchorId]) window.scrollBy(0, anchorEl.getBoundingClientRect().top - before[anchorId].top);
  if (reduceMotion) return;
  grid.querySelectorAll('article[data-id]').forEach(el => {
    const a = before[el.dataset.id];
    if (!a) return;
    const b = el.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    el.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }],
      { duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)' });
  });
}

// After a vote: update just that card in place first, then reorder a moment later
// so the user sees their vote land before the list shuffles.
function afterVote(id, votes){
  const i = STATE.listings.findIndex(x => x.id === id);
  if (i < 0) return;
  STATE.listings[i].votes = votes;
  const old = $('#grid').querySelector('article[data-id="' + CSS.escape(id) + '"]');
  if (!old || sortBy !== 'votes') { render(id); return; }
  old.outerHTML = card(STATE.listings[i]);
  restoreSlides($('#grid'));
  if (reorderTimer) clearTimeout(reorderTimer);
  reorderTimer = setTimeout(() => {
    render(id);
    const el = $('#grid').querySelector('article[data-id="' + CSS.escape(id) + '"]');
    if (el) { el.classList.add('just-voted'); setTimeout(() => el.classList.remove('just-voted'), 1200); }
  }, 700);
}

// 投票成功的庆祝，像收到 offer 一样：投票按钮炸开彩带和爱心 + 两侧礼炮 + 顶部横幅
const CONFETTI_COLORS = ['#e11d48', '#fb7185', '#4f46e5', '#a855f7', '#ec4899', '#facc15'];
let toastTimer = null, heartShape = null;
function celebrate(id){
  const l = STATE.listings.find(x => x.id === id);
  if (!l) return; // 等待期间切了标签页
  const toast = $('#toast');
  toast.textContent = '🎉 投票成功！给「' + (l.title || '未命名房源') + '」+1';
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);

  if (reduceMotion || !window.confetti) return;
  const btn = $('#grid').querySelector('article[data-id="' + CSS.escape(id) + '"] .vote-btn');
  if (btn) btn.classList.add('vote-pop');
  const r = btn && btn.getBoundingClientRect();
  const origin = r ? { x: (r.left + r.width / 2) / innerWidth, y: (r.top + r.height / 2) / innerHeight } : { x: .5, y: .6 };
  heartShape = heartShape || confetti.shapeFromText({ text: '❤️', scalar: 2 });
  confetti({ particleCount: 90, spread: 75, startVelocity: 40, origin, colors: CONFETTI_COLORS });
  confetti({ particleCount: 12, spread: 60, startVelocity: 32, origin, shapes: [heartShape], scalar: 2 });
  const end = Date.now() + 800;
  (function cannons(){
    confetti({ particleCount: 5, angle: 60, spread: 60, origin: { x: 0, y: .75 }, colors: CONFETTI_COLORS });
    confetti({ particleCount: 5, angle: 120, spread: 60, origin: { x: 1, y: .75 }, colors: CONFETTI_COLORS });
    if (Date.now() < end) requestAnimationFrame(cannons);
  })();
}

function renderNav(){

function switchView(v){

function switchTrip(k){

  trip = k; T = TRIPS[k]; filter = 'all';
  if (reorderTimer) { clearTimeout(reorderTimer); reorderTimer = null; } // 别让上一页投票后的重排画到新标签页

  $('#grid').innerHTML = ''; $('#countLbl').textContent = ''; $('#addMsg').textContent = '';

async function refresh(){
  const t = trip;
  const s = await api('/api/state?trip=' + t);
  if (t !== trip) return; // 等待期间切了标签页，丢掉旧结果
  STATE = s; render(); renderSplit(); enrichMissing();
}

async function enrichMissing(){
  const t = trip;
  for (const l of STATE.listings) {
    if (t !== trip) return;
    if (!l.image || l.rating == null || !l.images || l.images.length < 2 || !('lat' in l)) {
      try { const r = await api('/api/enrich', 'POST', { trip: t, id: l.id }); if (t === trip && r.ok && r.listing) { const i = STATE.listings.findIndex(x => x.id === l.id); if (i >= 0) STATE.listings[i] = r.listing; render(); } } catch(e){}
    }
  }
}

async function login(name){

async function doVote(id){
  const l = STATE.listings.find(x => x.id === id);
  const voted = (l.votes || []).some(v => v.token === myToken);
  if (voted) {
    const r = await api('/api/vote', 'POST', { trip, id, token: myToken, name: null });
    if (r.ok) afterVote(id, r.votes); // 切了标签页就找不到这间，afterVote 会忽略
  } else {
    const t = trip;
    ensureNameThen(async () => {
      const r = await api('/api/vote', 'POST', { trip: t, id, token: myToken, name: myName });
      if (r.ok) { afterVote(id, r.votes); celebrate(id); }
    });
  }
}

// 成员名单：全员共用的用户列表（登录、投票、分账都是这一份）+ 账里出现过的名字
function knownNames(){
  const out = [];
  const push = n => { n = String(n || '').trim(); if (n && !out.some(x => x.toLowerCase() === n.toLowerCase())) out.push(n); };
  USERS.forEach(u => push(u.name));
  push(myName);
  (STATE.expenses || []).forEach(e => { push(e.paidBy); (e.splitAmong || []).forEach(push); });
  return out;
}
function renderSplit(){
  const names = knownNames();
  $('#memberChips').innerHTML = names.length
    ? names.map(n => '<span class="chip">' + esc(n) + '</span>').join('')
    : '<span class="text-sm text-slate-400">还没有成员，先加上大家的名字（投过票的人会自动出现）</span>';
  const sel = $('#ePaidBy'); const prev = sel.value;
  sel.innerHTML = names.map(n => '<option' + ((prev ? n === prev : n === myName) ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
  const prevChecked = {};
  document.querySelectorAll('#eSplit input[type=checkbox]').forEach(c => { prevChecked[c.value] = c.checked; });
  $('#eSplit').innerHTML = names.length
    ? names.map(n => '<label class="inline-flex items-center gap-1 mr-3 mb-1 text-sm"><input type="checkbox" value="' + esc(n) + '"' + ((n in prevChecked) ? (prevChecked[n] ? ' checked' : '') : ' checked') + '> ' + esc(n) + '</label>').join('')
    : '<span class="text-sm text-slate-400">先加成员</span>';
  const bal = STATE.balances || {};
  const entries = Object.entries(bal).sort((a, b) => b[1] - a[1]);
  $('#balances').innerHTML = entries.length
    ? '<h3 class="font-bold mb-2">余额（+ 应收回 · − 应付出）</h3>' + entries.map(([n, c]) =>
        '<div class="flex justify-between border-b py-1.5 text-sm"><span>' + esc(n) + '</span><span class="font-medium '
        + (c > 0 ? 'text-emerald-600' : c < 0 ? 'text-rose-600' : 'text-slate-400') + '">'
        + (c === 0 ? '已结清' : (c > 0 ? '+' : '−') + fmtMoney(c)) + '</span></div>').join('')
    : '';
  const st = STATE.settlements || [];
  $('#settlements').innerHTML = st.length
    ? '<h3 class="font-bold mb-2">💸 这样结清最省事</h3>' + st.map(s => '<div class="text-sm py-1">' + esc(s.from) + ' 付给 ' + esc(s.to) + ' <b>' + fmtMoney(s.amountCents) + '</b></div>').join('')
    : (entries.length ? '<p class="text-sm text-emerald-600">大家已经结清了 🎉</p>' : '');
  const exps = STATE.expenses || [];
  $('#expenses').innerHTML = exps.length
    ? '<h3 class="font-bold mb-2">支出记录</h3>' + exps.map(e =>
        '<div class="flex items-center gap-2 border-b py-2 text-sm' + (e.id === editingId ? ' bg-amber-50 -mx-2 px-2 rounded-lg' : '') + '"><div class="flex-1"><div>' + esc(e.description)
        + '</div><div class="text-slate-500 text-xs">' + esc(e.paidBy) + ' 付的 · 分摊给 ' + (e.splitAmong || []).map(esc).join('、')
        + '</div></div><div class="font-medium">' + fmtMoney(e.amountCents)
        + '</div><button onclick="editExpense(\'' + e.id + '\')" class="text-slate-400 hover:text-indigo-600 px-1" title="修改这笔">✎</button>'
        + '<button onclick="removeExpense(\'' + e.id + '\')" class="text-slate-400 hover:text-red-600 px-1" title="删除这笔">✕</button></div>').join('')
    : '<p class="text-sm text-slate-400">还没有支出记录</p>';
}
function applySplitView(r){
  if (r.expenses) STATE.expenses = r.expenses;
  if (r.balances) STATE.balances = r.balances;
  if (r.settlements) STATE.settlements = r.settlements;
  if (r.users) { USERS = r.users; renderUserSel(); }
}
async function loadSplit(){
  try { const r = await api('/api/split'); if (r.ok) { applySplitView(r); renderSplit(); } } catch(e){}
}
// 加成员 = 加进全员共用的用户列表，之后登录时直接选名字
async function addMember(){
  const v = $('#memberInput').value.trim();
  if (!v) return;
  const r = await api('/api/member', 'POST', { name: v });
  if (r.ok) { $('#memberInput').value = ''; applySplitView(r); renderSplit(); }
  else alert('添加失败：' + (r.error || ''));
}
// ---- 修改一笔：把它填进上面的表单，按钮变成「保存修改」 ----
function readForm(){
  return { desc: $('#eDesc').value, amount: $('#eAmount').value, paidBy: $('#ePaidBy').value,
    checked: [...document.querySelectorAll('#eSplit input[type=checkbox]')].filter(c => c.checked).map(c => c.value) };
}
function fillForm(f){
  $('#eDesc').value = f.desc; $('#eAmount').value = f.amount;
  if (f.paidBy) $('#ePaidBy').value = f.paidBy;
  const on = f.checked.map(n => n.toLowerCase());
  document.querySelectorAll('#eSplit input[type=checkbox]').forEach(c => { c.checked = on.includes(c.value.toLowerCase()); });
}
function setEditMode(on){
  $('#eAddBtn').textContent = on ? '保存修改' : '记一笔';
  $('#eCancelBtn').classList.toggle('hidden', !on);
}
function editExpense(id){
  const e = (STATE.expenses || []).find(x => x.id === id);
  if (!e) return;
  if (!editingId) addDraft = readForm();
  editingId = id;
  renderSplit(); // 高亮正在改的这一行
  fillForm({ desc: e.description, amount: String(e.amountCents / 100), paidBy: e.paidBy, checked: e.splitAmong || [] });
  setEditMode(true);
  $('#eMsg').textContent = '正在修改「' + e.description + '」，改好点「保存修改」';
  $('#eDesc').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function exitEdit(){
  editingId = null;
  setEditMode(false);
  renderSplit();
  if (addDraft) { fillForm(addDraft); addDraft = null; }
}
async function saveExpense(){
  const splitAmong = [...document.querySelectorAll('#eSplit input[type=checkbox]:checked')].map(c => c.value);
  const amountUSD = $('#eAmount').value ? Number($('#eAmount').value) : null;
  if (!amountUSD) { $('#eMsg').textContent = '先填金额'; return; }
  if (!$('#ePaidBy').value) { $('#eMsg').textContent = '先加成员并选择付款人'; return; }
  const body = { description: $('#eDesc').value.trim(), amountUSD, paidBy: $('#ePaidBy').value, splitAmong };
  if (editingId) {
    const r = await api('/api/expense-update', 'POST', { id: editingId, ...body });
    if (r.ok) { applySplitView(r); exitEdit(); $('#eMsg').textContent = '改好了 ✅'; }
    else if (r.error === '支出不存在') { exitEdit(); loadSplit(); $('#eMsg').textContent = '这笔已经被别人删掉了'; }
    else $('#eMsg').textContent = r.error || '修改失败';
    return;
  }
  const r = await api('/api/expense', 'POST', body);
  if (r.ok) { $('#eDesc').value = ''; $('#eAmount').value = ''; $('#eMsg').textContent = '记上了 ✅'; applySplitView(r); renderSplit(); }
  else $('#eMsg').textContent = r.error || '记账失败';
}
async function removeExpense(id){
  if (!confirm('删除这笔支出？')) return;
  const r = await api('/api/expense-remove', 'POST', { id });
  if (r.ok) { applySplitView(r); if (id === editingId) exitEdit(); else renderSplit(); } else alert('删除失败，稍后再试');
}
// 卡片上的「用这间分账」：把房源标题和总价预填进分账表单
function splitListing(id){
  const l = STATE.listings.find(x => x.id === id);
  if (!l) return;
  if (editingId) exitEdit();
  $('#eDesc').value = l.title || '房费';
  if (l.priceUSD) $('#eAmount').value = l.priceUSD;
  switchView('split');
  $('#eAmount').focus({ preventScroll: true });
}
$('#memberBtn').onclick = addMember;
$('#memberInput').addEventListener('keydown', e => { if (e.key === 'Enter') addMember(); });
$('#eAddBtn').onclick = saveExpense;
$('#eCancelBtn').onclick = () => { exitEdit(); $('#eMsg').textContent = ''; };

// 筛选按钮和标签页都是动态生成的，用事件委托
$('#filters').onclick = e => {
  const b = e.target.closest('.filter-chip');
  if (!b) return;
  document.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); filter = b.dataset.f; render();
};
$('#tabs').onclick = e => { const b = e.target.closest('.trip-tab'); if (b) switchTrip(b.dataset.trip); };
$('#mapToggle').onclick = toggleMap;
// 鼠标停在卡片上时，地图上对应的钉子跟着高亮
let hotId = null;
$('#grid').addEventListener('mouseover', e => {
  const a = e.target.closest('article[data-id]'); const id = a ? a.dataset.id : null;
  if (id === hotId) return;
  if (hotId) setHot(hotId, false);
  hotId = id; if (id) setHot(id, true);
});
$('#grid').addEventListener('mouseleave', () => { if (hotId) setHot(hotId, false); hotId = null; });
$('#sortSel').onchange = e => { sortBy = e.target.value; render(); };

document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => switchView(b.dataset.view));

renderNav();
renderTrip();
refresh();
</script>
</body>
</html>
