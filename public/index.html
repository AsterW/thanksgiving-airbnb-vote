  /* ---------- 开场动画 ---------- */
  #splash { display:none; }

  #splash { position:fixed; inset:0; z-index:100; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; color:#fff; text-align:center;
    background: radial-gradient(90% 60% at 80% 10%, rgba(236,72,153,.45), transparent 60%), radial-gradient(70% 50% at 10% 20%, rgba(99,102,241,.5), transparent 60%), linear-gradient(180deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
    transition: transform .8s cubic-bezier(.7,0,.2,1), opacity .8s ease; }
  #splash.leave { transform: translateY(-100%); }
  #splash .sp-sun { position:absolute; width:min(46vw,340px); aspect-ratio:1; border-radius:50%; bottom:18%; background:radial-gradient(circle, #fde68a 0%, #fb923c 55%, rgba(251,146,60,0) 70%); filter: blur(2px); opacity:0; animation: sp-sun 1.6s .1s ease-out forwards; }
  #splash .sp-mtn { position:absolute; left:0; right:0; bottom:0; width:100%; height:auto; transform: translateY(100%); animation: sp-rise 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
  #splash .sp-mtn.m1 { animation-delay:.05s; } #splash .sp-mtn.m2 { animation-delay:.2s; } #splash .sp-mtn.m3 { animation-delay:.35s; }
  #splash .sp-content { position:relative; z-index:2; margin-bottom:12vh; padding:0 24px; }
  #splash .sp-turkey { font-size:clamp(56px, 12vw, 96px); display:inline-block; opacity:0; animation: sp-drop .9s .45s cubic-bezier(.3,1.6,.5,1) forwards; }
  #splash .sp-title { font-weight:900; font-size:clamp(30px, 7vw, 64px); letter-spacing:.02em; margin-top:8px; text-shadow:0 6px 30px rgba(0,0,0,.35); }
  #splash .sp-title span { display:inline-block; opacity:0; transform: translateY(24px) rotate(6deg); animation: sp-letter .6s cubic-bezier(.2,.9,.3,1.2) forwards; white-space:pre; }
  #splash .sp-sub { margin-top:10px; font-size:clamp(13px, 2.6vw, 18px); color:#e0e7ff; opacity:0; animation: sp-fade .7s 1.35s ease forwards; }
  #splash .sp-bar { width:140px; height:3px; border-radius:3px; background:rgba(255,255,255,.18); margin:22px auto 0; overflow:hidden; opacity:0; animation: sp-fade .4s 1.5s ease forwards; }
  #splash .sp-bar i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#a5b4fc,#f9a8d4); transform-origin:left; transform:scaleX(0); animation: sp-load 1.1s 1.55s ease-in-out forwards; }
  #splash .sp-skip { position:absolute; z-index:3; right:18px; bottom:calc(env(safe-area-inset-bottom, 0px) + 16px); font-size:12px; color:rgba(255,255,255,.65); }
  #splash .sp-leaf { position:absolute; top:-8vh; z-index:1; font-size:22px; opacity:0; animation: sp-leaf linear forwards; }
  @media (max-width: 640px) { #splash .sp-snow { display:none; } } /* 窄屏上 SVG 被横向压扁，雪顶会变形 */
  @keyframes sp-rise { to { transform: translateY(0); } }
  @keyframes sp-sun { 0% { opacity:0; transform: translateY(40%) scale(.8); } 100% { opacity:.9; transform: translateY(0) scale(1); } }
  @keyframes sp-drop { 0% { opacity:0; transform: translateY(-80px) scale(.6) rotate(-20deg); } 100% { opacity:1; transform: none; } }
  @keyframes sp-letter { to { opacity:1; transform:none; } }
  @keyframes sp-fade { to { opacity:1; } }
  @keyframes sp-load { to { transform:scaleX(1); } }
  @keyframes sp-leaf { 0% { opacity:0; transform: translate(0,0) rotate(0); } 10% { opacity:.95; } 100% { opacity:.9; transform: translate(var(--dx), 115vh) rotate(var(--rot)); } }
  @media (prefers-reduced-motion: reduce) {
    #splash, #splash * { animation-duration:.01s !important; animation-delay:0s !important; }
    #splash { transition: opacity .4s ease; }
    #splash.leave { transform:none; opacity:0; }
    #splash .sp-leaf { display:none; }
  }
</style>

<!-- 开场动画（每个会话一次，点一下可跳过） -->
<div id="splash" role="presentation" aria-hidden="true">
  <div class="sp-sun"></div>
  <svg class="sp-mtn m1" viewBox="0 0 1440 360" preserveAspectRatio="none" style="height:46vh"><path fill="#6d28d9" fill-opacity=".55" d="M0 250 L120 170 L230 220 L360 110 L470 190 L600 90 L720 180 L840 70 L980 200 L1100 120 L1220 190 L1340 100 L1440 160 L1440 360 L0 360Z"/></svg>
  <svg class="sp-mtn m2" viewBox="0 0 1440 360" preserveAspectRatio="none" style="height:36vh"><path fill="#4c1d95" d="M0 280 L150 190 L260 250 L400 150 L520 230 L660 140 L800 240 L930 160 L1060 250 L1190 170 L1320 240 L1440 200 L1440 360 L0 360Z"/><path class="sp-snow" fill="#fff" fill-opacity=".85" d="M400 150 L372 168 L392 166 L404 178 L418 164 L432 172Z M660 140 L630 160 L652 158 L664 170 L678 156 L694 164Z M930 160 L902 178 L922 176 L934 188 L948 174 L962 180Z M1190 170 L1164 186 L1182 184 L1194 196 L1206 182 L1220 188Z"/></svg>
  <svg class="sp-mtn m3" viewBox="0 0 1440 360" preserveAspectRatio="none" style="height:24vh"><path fill="#1e1b4b" d="M0 300 L90 250 L200 290 L320 230 L430 280 L560 220 L700 290 L820 240 L960 300 L1080 250 L1210 290 L1330 240 L1440 270 L1440 360 L0 360Z"/></svg>
  <div class="sp-content">
    <div class="sp-turkey">🦃</div>
    <div class="sp-title" id="spTitle">Denver 感恩节之旅</div>
    <div class="sp-sub">11月25–29 · 选房 · 投票 · 分账 · 大家一起</div>
    <div class="sp-bar"><i></i></div>
  </div>
  <div class="sp-skip">点击任意处跳过</div>
</div>
<script>
// 开场动画：逐字出现的标题 + 飘落的枫叶，播完（或被点掉）后整块往上收走
const splashDone = new Promise(resolve => {
  const el = document.getElementById('splash');
  if (!document.documentElement.classList.contains('splash')) { el.remove(); resolve(); return; }
  try { sessionStorage.setItem('splashSeen', '1'); } catch(e) {}
  const t = document.getElementById('spTitle');
  t.innerHTML = Array.from(t.textContent).map((c, i) => '<span style="animation-delay:' + (0.7 + i * 0.06).toFixed(2) + 's">' + c + '</span>').join('');
  ['🍁', '🍂', '🍁', '🍂', '🍁', '🍂', '🍁', '🍂', '🍁', '🍂'].forEach((leaf, i) => {
    const s = document.createElement('span');
    s.className = 'sp-leaf'; s.textContent = leaf;
    s.style.left = (5 + Math.random() * 90) + '%';
    s.style.fontSize = (16 + Math.random() * 18) + 'px';
    s.style.animationDuration = (3 + Math.random() * 2.5) + 's';
    s.style.animationDelay = (Math.random() * 1.8) + 's';
    s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    s.style.setProperty('--rot', (Math.random() * 540 - 270) + 'deg');
    el.appendChild(s);
  });
  let gone = false;
  function leave(){
    if (gone) return; gone = true;
    el.classList.add('leave');
    document.documentElement.classList.remove('splash-lock'); // 恢复页面滚动
    setTimeout(() => { el.remove(); document.documentElement.classList.remove('splash'); }, 850);
    setTimeout(resolve, 450); // 幕布收到一半就可以弹登录框了
    removeEventListener('keydown', leave);
  }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(leave, reduce ? 700 : 2900);
  el.addEventListener('click', leave);
  addEventListener('keydown', leave);
});
</script>

<script>
const $ = s => document.querySelector(s);
// 两段行程，各自一份候选清单（后端按 trip 分开存）
const TRIPS = {
  nov25: { date: '11月25–26', people: 9, nights: 1, checkIn: '2026-11-25', checkOut: '2026-11-26', areas: ['Denver 市区', 'Denver 周边'] },
  nov26: { date: '11月26–29', people: 14, nights: 3, checkIn: '2026-11-26', checkOut: '2026-11-29', areas: ['大沙丘区域', '落基山 · Estes Park'] },
};
const [hashTrip, hashView] = location.hash.slice(1).split('/');
let trip = TRIPS[hashTrip] ? hashTrip : 'nov25';
// 左侧导航的两个页面
const VIEWS = {
  hunt:  { title: '🏠 AirBnb hunting · 一起选房', sub: '看中哪间就把 Airbnb 链接贴进来，票数最高的我们就订它' },
  split: { title: '💰 Split that bill · 分账', sub: '全员一本账 · 共同支出记在这里，自动算清谁该给谁多少钱' },
};
let view = VIEWS[hashView] ? hashView : 'hunt';
function syncHash(){ history.replaceState(null, '', '#' + trip + (view === 'hunt' ? '' : '/' + view)); }
let T = TRIPS[trip];
let STATE = { listings: [], expenses: [], balances: {}, settlements: [] };
let myToken = localStorage.getItem('vt');
if (!myToken) { myToken = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); localStorage.setItem('vt', myToken); }
let myName = localStorage.getItem('vn') || '';
let filter = 'all', sortBy = 'votes';
let editingId = null, editDraft = null; // 分账里正在修改的那笔，和它编辑框里还没保存的内容
let pendingVoteId = null;

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(path, method, body){
  const r = await fetch(path, { method: method || 'GET', headers: {'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

function statsLine(l){
  const parts = [];
  if (l.bedrooms) parts.push(l.bedrooms + '卧');
  if (l.beds) parts.push(l.beds + '床');
  if (l.bathrooms) parts.push(l.bathrooms + '卫');
  if (l.sleeps) parts.push('可住' + l.sleeps + '人');
  return parts.length ? parts.join(' · ') : '户型信息待补充';
}

// 按当前行程的日期和人数打开 Airbnb，直接看到实时总价
function airbnbLink(l){
  return 'https://www.airbnb.com/rooms/' + l.roomId + '?adults=' + T.people + '&check_in=' + T.checkIn + '&check_out=' + T.checkOut;
}

// ---------- 价格：优先用 Airbnb 实时报价（按当前行程的日期和人数） ----------
function liveOf(l){ return l.live && l.live.checkIn === T.checkIn && l.live.checkOut === T.checkOut ? l.live : null; }
function isBooked(l){ const v = liveOf(l); return !!(v && !v.available); }
// 用来排序/地图/分账的价格：有实时价用实时价，否则退回手动填的估价
function effPrice(l){
  const v = liveOf(l);
  if (v) return v.available ? v.total : null;
  return l.priceUSD || null;
}
function ago(ts){
  const m = Math.round((Date.now() - ts) / 60000);
  return m < 1 ? '刚刚' : m < 60 ? m + ' 分钟前' : m < 1440 ? Math.round(m / 60) + ' 小时前' : Math.round(m / 1440) + ' 天前';
}
const UNAVAILABLE = { DATE: '这几天已经被订了', GUEST: '住不下这么多人，Airbnb 不给报价', MIN_NIGHTS: '不满足最少入住晚数', MAX_NIGHTS: '超过最多入住晚数' };
function priceBlock(l){
  const v = liveOf(l);
  if (v && !v.available) {
    return '<div class="inline-flex items-center gap-1 text-sm font-bold text-rose-700 bg-rose-50 border border-rose-200 rounded-lg px-2 py-1">❌ ' + esc(UNAVAILABLE[v.reason] || '这几天订不了') + '</div>'
      + '<div class="text-xs text-slate-400 mt-1">Airbnb 实时查询 · ' + ago(v.at) + '</div>';
  }
  if (v && v.total) {
    return '<div class="text-lg font-bold text-slate-800">$' + v.total.toLocaleString()
      + (v.original && v.original > v.total ? ' <s class="text-sm font-normal text-slate-400">$' + v.original.toLocaleString() + '</s>' : '')
      + ' <span class="text-xs font-normal text-slate-500">/ ' + v.nights + '晚总价</span></div>'
      + '<div class="text-xs text-emerald-700 mt-0.5">✓ Airbnb 实时价' + (v.guests < T.people ? ' · 按 ' + v.guests + ' 人计' : '') + ' · ' + ago(v.at) + '</div>';
  }
  // 还没查到实时价：早期预置房源的手动估价是 11/25–29 的 4 晚总价
  if (l.priceUSD) return '<div class="text-lg font-bold text-slate-500">约 $' + Number(l.priceUSD).toLocaleString() + ' <span class="text-xs font-normal">/ ' + (l.priceNights || 4) + '晚</span></div>'
    + '<div class="text-xs text-slate-400 mt-0.5">手动估价 · 实时价查询中…</div>';
  return '<div class="text-sm text-slate-500">实时价查询中…</div>';
}

function card(l){
  const voted = (l.votes || []).some(v => v.token === myToken);
  const n = (l.votes || []).length;
  const voters = (l.votes || []).map(v => '<span class="chip">' + esc(v.name || '匿名') + '</span>').join('');
  const price = priceBlock(l);
  const tooSmall = l.sleeps && l.sleeps < T.people ? '<p class="text-sm text-amber-600 mb-2">⚠️ 最多住 ' + l.sleeps + ' 人，不够 ' + T.people + ' 人</p>' : '';
  const rating = l.rating ? '<span class="text-sm">⭐ ' + l.rating + (l.reviews ? '（' + l.reviews + '条评价）' : '') + '</span>' : '';
  const area = l.area ? '<span class="absolute top-3 left-3 bg-black/60 text-white text-xs px-2 py-1 rounded-full">' + esc(l.area) + '</span>' : '';
  const del = '<button onclick="removeListing(\'' + l.id + '\')" title="删除这个房源" class="absolute top-3 right-3 bg-black/60 hover:bg-red-600 text-white text-xs px-2 py-1 rounded-full">✕</button>';
  const pics = (l.images && l.images.length) ? l.images : (l.image ? [l.image] : []);
  let img;
  if (!pics.length) img = '<div class="card-img w-full rounded-t-2xl bg-slate-200 flex items-center justify-center text-slate-400 text-4xl">🏠</div>';
  else if (pics.length === 1) img = '<img src="' + esc(pics[0]) + '" class="card-img w-full rounded-t-2xl" loading="lazy" alt="">';
  else img = '<div class="carousel rounded-t-2xl" onscroll="carSync(this)">'
      + pics.map(u => '<img src="' + esc(u) + '" class="card-img" loading="lazy" alt="">').join('') + '</div>'
      + '<button class="car-arrow left-2" onclick="carStep(this,-1)" aria-label="上一张" disabled>‹</button>'
      + '<button class="car-arrow right-2" onclick="carStep(this,1)" aria-label="下一张">›</button>'
      + '<div class="car-dots">' + pics.map((_, i) => '<button onclick="carGo(this,' + i + ')" aria-label="第' + (i + 1) + '张"' + (i ? '' : ' class="on"') + '></button>').join('') + '</div>';
  return '<article data-id="' + esc(l.id) + '" class="bg-white rounded-2xl shadow overflow-hidden flex flex-col' + (isBooked(l) ? ' opacity-60 grayscale-[40%] hover:opacity-100 hover:grayscale-0 transition' : '') + '">'
    + '<div class="relative car-wrap">' + img + area + del + '</div>'
    + '<div class="p-4 flex flex-col flex-1">'
    + '<h3 class="font-bold leading-snug mb-1">' + esc(l.title || '未命名房源') + '</h3>'
    + '<p class="text-sm text-slate-500 mb-2">' + esc(statsLine(l)) + '</p>'
    + tooSmall
    + '<div class="mb-1">' + price + '</div>'
    + '<div class="mb-2">' + rating + '</div>'
    + (l.note ? '<p class="text-sm text-slate-600 mb-2">💡 ' + esc(l.note) + '</p>' : '')
    + (voters ? '<div class="mb-3">' + voters + '</div>' : '<div class="mb-3 text-xs text-slate-400">还没有人投票，来当第一个吧</div>')
    + '<div class="mt-auto flex gap-2">'
    + '<button onclick="doVote(\'' + l.id + '\')" class="vote-btn flex-1 border-2 border-rose-500 text-rose-600 font-bold rounded-xl py-2 ' + (voted ? 'voted' : '') + '">' + (voted ? '❤️ 已投 · ' : '🤍 投票 · ') + n + '</button>'
    + '<a href="' + esc(airbnbLink(l)) + '" target="_blank" rel="noopener" title="按 ' + T.date + ' · ' + T.people + '人查看实时价格" class="border-2 border-slate-200 rounded-xl px-4 py-2 text-sm font-medium text-slate-600 hover:border-indigo-400">去 Airbnb ↗</a>'
    + '</div>'
    + '<button onclick="splitListing(\'' + l.id + '\')" class="mt-2 border-2 border-emerald-100 text-emerald-700 rounded-xl py-1.5 text-sm font-medium hover:border-emerald-400">💰 用这间分账</button>'
    + '</div></article>';
}

// ---- photo carousel ----
const slideIdx = {}; // listing id -> current photo, so re-renders keep your place
function carOf(el){ return el.closest('.car-wrap').querySelector('.carousel'); }
function carSync(c){
  const i = Math.round(c.scrollLeft / c.clientWidth);
  const wrap = c.closest('.car-wrap');
  wrap.querySelectorAll('.car-dots button').forEach((d, k) => d.classList.toggle('on', k === i));
  const [prev, next] = wrap.querySelectorAll('.car-arrow');
  prev.disabled = i <= 0; next.disabled = i >= c.children.length - 1;
  const art = c.closest('article'); if (art) slideIdx[art.dataset.id] = i;
}
function carGo(el, i){ const c = carOf(el); c.scrollTo({ left: i * c.clientWidth, behavior: reduceMotion ? 'auto' : 'smooth' }); }
function carStep(el, d){ const c = carOf(el); carGo(el, Math.round(c.scrollLeft / c.clientWidth) + d); }
function restoreSlides(root){
  root.querySelectorAll('article[data-id] .carousel').forEach(c => {
    const i = slideIdx[c.closest('article').dataset.id];
    if (i) { c.scrollLeft = i * c.clientWidth; carSync(c); }
  });
}

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let reorderTimer = null;

// ---------- 地图：当前筛选下的房源都钉在上面 ----------
let map = null, mapLayer = null, mapKey = '', mapList = [];
const pinById = {};
let showMap = true;
try { showMap = localStorage.getItem('showMap') !== '0'; } catch(e){}
function mapVisible(){ return showMap && view === 'hunt' && window.L; }
function ensureMap(){
  if (map || !window.L) return map;
  map = L.map('map', { scrollWheelZoom: false, zoomControl: true, attributionControl: true, zoomSnap: 0.25 });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, className: 'osm-tiles',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  map.setView([39.2, -105.3], 7); // 科罗拉多中部，等房源坐标来了再缩放
  map.on('click', () => map.scrollWheelZoom.enable()); // 点一下地图之后才允许滚轮缩放，免得滚页面时误缩放
  map.on('mouseout', () => map.scrollWheelZoom.disable());
  mapLayer = L.layerGroup().addTo(map);
  return map;
}
function pinHtml(l){
  const n = (l.votes || []).length;
  const mine = (l.votes || []).some(v => v.token === myToken);
  const booked = isBooked(l), p = effPrice(l);
  const label = booked ? '已订满' : p ? '$' + p.toLocaleString() : '🏠';
  return '<div class="pin' + (mine ? ' mine' : '') + (booked ? ' booked' : '') + '" data-id="' + esc(l.id) + '">' + label + (n ? '<span class="pin-votes">♥' + n + '</span>' : '') + '</div>';
}
function popupHtml(l){
  const pic = (l.images && l.images[0]) || l.image;
  const n = (l.votes || []).length;
  return (pic ? '<img src="' + esc(pic) + '" style="width:100%;aspect-ratio:16/10;object-fit:cover" alt="">' : '')
    + '<div style="padding:10px 12px 12px"><div style="font-weight:700;line-height:1.3;margin-bottom:4px">' + esc(l.title || '未命名房源') + '</div>'
    + '<div style="color:#64748b;font-size:12px;margin-bottom:8px">' + esc(statsLine(l)) + (n ? ' · ♥ ' + n + ' 票' : '') + '</div>'
    + '<button onclick="focusCard(\'' + l.id + '\')" style="width:100%;background:#4f46e5;color:#fff;font-weight:700;border-radius:10px;padding:6px 0">看这间 ↓</button></div>';
}
function renderMap(list){
  mapList = list;
  $('#mapBox').hidden = !showMap;
  $('#mapToggle').textContent = showMap ? '🗺️ 隐藏地图' : '🗺️ 显示地图';
  if (!mapVisible() || !ensureMap()) return;
  mapLayer.clearLayers();
  Object.keys(pinById).forEach(k => delete pinById[k]);
  const pts = [];
  list.forEach(l => {
    if (l.lat == null || l.lng == null) return;
    const m = L.marker([l.lat, l.lng], { icon: L.divIcon({ className: 'pin-wrap', html: pinHtml(l), iconSize: [0, 0] }), riseOnHover: true })
      .bindPopup(popupHtml(l), { maxWidth: 240, minWidth: 230, closeButton: true, autoPanPadding: [20, 20] })
      .addTo(mapLayer);
    pinById[l.id] = m;
    pts.push([l.lat, l.lng]);
  });
  const missing = list.length - pts.length;
  $('#mapNote').hidden = !missing;
  $('#mapNote').textContent = missing + ' 间还在获取位置…';
  // 只有房源集合变了（换行程/筛选/新加房源）才重新取景，投票重排不动地图
  const key = trip + '|' + filter + '|' + list.map(l => l.id + (l.lat != null ? '@' : '')).sort().join(',');
  if (key !== mapKey) {
    mapKey = key;
    map.invalidateSize();
    // 不做动画：坐标是一间间陆续到的，连续的缩放动画会互相打断，停在半路
    if (pts.length === 1) map.setView(pts[0], 12, { animate: false });
    else if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 13, animate: false });
  }
}
function setHot(id, on){
  const m = pinById[id];
  const el = m && m.getElement() && m.getElement().querySelector('.pin');
  if (!el) return;
  el.classList.toggle('hot', on);
  m.setZIndexOffset(on ? 1000 : 0);
}
function focusCard(id){
  const el = $('#grid').querySelector('article[data-id="' + CSS.escape(id) + '"]');
  if (!el) return;
  el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function toggleMap(){
  showMap = !showMap;
  try { localStorage.setItem('showMap', showMap ? '1' : '0'); } catch(e){}
  mapKey = '';
  renderMap(mapList);
}

// Re-render the grid. Cards that change position glide to their new spot (FLIP).
// If anchorId is given, the page scrolls so that card stays where it was on screen.
function render(anchorId){
  if (reorderTimer) { clearTimeout(reorderTimer); reorderTimer = null; }
  const grid = $('#grid');
  const before = {};
  grid.querySelectorAll('article[data-id]').forEach(el => { before[el.dataset.id] = el.getBoundingClientRect(); });
  let list = STATE.listings.slice();
  if (filter !== 'all') list = list.filter(l => l.area === filter);
  if (sortBy === 'votes') list.sort((a,b) => (b.votes||[]).length - (a.votes||[]).length || (effPrice(a)||1e9) - (effPrice(b)||1e9));
  else if (sortBy === 'added') list.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)); // 最新添加的在前；没有 createdAt 的老房源排最后
  else list.sort((a,b) => (effPrice(a)||1e9) - (effPrice(b)||1e9)); // 订满的没有价格，自然排到最后
  grid.innerHTML = list.length ? list.map(card).join('') : '<p class="text-slate-400 col-span-full text-center py-10">' + (filter === 'all' ? '还没有候选' : '这个区域还没有候选') + '，贴个 Airbnb 链接进来吧 👆</p>';
  $('#countLbl').textContent = '共 ' + STATE.listings.length + ' 间候选';
  restoreSlides(grid);
  renderMap(list);

  const anchorEl = anchorId && grid.querySelector('article[data-id="' + CSS.escape(anchorId) + '"]');
  if (anchorEl && before[anchorId]) window.scrollBy(0, anchorEl.getBoundingClientRect().top - before[anchorId].top);
  if (reduceMotion) return;
  grid.querySelectorAll('article[data-id]').forEach(el => {
    const a = before[el.dataset.id];
    if (!a) return;
    const b = el.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    el.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }],
      { duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)' });
  });
}

// After a vote: update just that card in place first, then reorder a moment later
// so the user sees their vote land before the list shuffles.
function afterVote(id, votes){
  const i = STATE.listings.findIndex(x => x.id === id);
  if (i < 0) return;
  STATE.listings[i].votes = votes;
  const old = $('#grid').querySelector('article[data-id="' + CSS.escape(id) + '"]');
  if (!old || sortBy !== 'votes') { render(id); return; }
  old.outerHTML = card(STATE.listings[i]);
  restoreSlides($('#grid'));
  if (reorderTimer) clearTimeout(reorderTimer);
  reorderTimer = setTimeout(() => {
    render(id);
    const el = $('#grid').querySelector('article[data-id="' + CSS.escape(id) + '"]');
    if (el) { el.classList.add('just-voted'); setTimeout(() => el.classList.remove('just-voted'), 1200); }
  }, 700);
}

// 投票成功的庆祝，像收到 offer 一样：投票按钮炸开彩带和爱心 + 两侧礼炮 + 顶部横幅
const CONFETTI_COLORS = ['#e11d48', '#fb7185', '#4f46e5', '#a855f7', '#ec4899', '#facc15'];
let toastTimer = null, heartShape = null;
function celebrate(id){
  const l = STATE.listings.find(x => x.id === id);
  if (!l) return; // 等待期间切了标签页
  const toast = $('#toast');
  toast.textContent = '🎉 投票成功！给「' + (l.title || '未命名房源') + '」+1';
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);

  if (reduceMotion || !window.confetti) return;
  const btn = $('#grid').querySelector('article[data-id="' + CSS.escape(id) + '"] .vote-btn');
  if (btn) btn.classList.add('vote-pop');
  const r = btn && btn.getBoundingClientRect();
  const origin = r ? { x: (r.left + r.width / 2) / innerWidth, y: (r.top + r.height / 2) / innerHeight } : { x: .5, y: .6 };
  heartShape = heartShape || confetti.shapeFromText({ text: '❤️', scalar: 2 });
  confetti({ particleCount: 90, spread: 75, startVelocity: 40, origin, colors: CONFETTI_COLORS });
  confetti({ particleCount: 12, spread: 60, startVelocity: 32, origin, shapes: [heartShape], scalar: 2 });
  const end = Date.now() + 800;
  (function cannons(){
    confetti({ particleCount: 5, angle: 60, spread: 60, origin: { x: 0, y: .75 }, colors: CONFETTI_COLORS });
    confetti({ particleCount: 5, angle: 120, spread: 60, origin: { x: 1, y: .75 }, colors: CONFETTI_COLORS });
    if (Date.now() < end) requestAnimationFrame(cannons);
  })();
}

// 切换行程时重画标题、标签页、区域筛选和手动表单
function renderTrip(){
  // 分账是全员一本账，不分行程：不显示行程标签页和日期人数
  const forTrip = view !== 'split';
  $('#tripSub').textContent = (forTrip ? T.date + ' · ' + T.people + '人 · 住' + T.nights + '晚 · ' : '') + VIEWS[view].sub;
  $('#tabs').classList.toggle('hidden', !forTrip); // 用 class：hidden 属性会被 .flex 盖掉
  $('#tabs').innerHTML = Object.keys(TRIPS).map(k => {
    const t = TRIPS[k];
    return '<button data-trip="' + k + '" class="trip-tab rounded-full px-5 py-2 font-bold' + (k === trip ? ' active' : '') + '">'
      + t.date + ' <span class="font-normal text-sm opacity-80">· ' + t.people + '人 · ' + t.nights + '晚</span></button>';
  }).join('');
  $('#filters').innerHTML = ['all'].concat(T.areas).map(a =>
    '<button data-f="' + esc(a) + '" class="filter-chip border rounded-full px-4 py-1.5 text-sm bg-white' + (a === filter ? ' active' : '') + '">' + (a === 'all' ? '全部' : esc(a)) + '</button>'
  ).join('');
  $('#mArea').innerHTML = '<option value="">区域（可选）</option>' + T.areas.concat('其他').map(a => '<option>' + esc(a) + '</option>').join('');
  $('#mPrice').placeholder = T.nights + '晚总价 USD（可选）';
}

function renderNav(){
  document.querySelectorAll('[data-view]').forEach(b => {
    const on = b.dataset.view === view;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('#viewTitle').textContent = VIEWS[view].title;
  Object.keys(VIEWS).forEach(v => { $('#view-' + v).hidden = v !== view; });
}
function switchView(v){
  if (v === view || !VIEWS[v]) return;
  view = v;
  syncHash();
  renderNav();
  renderTrip();
  if (v === 'split') loadSplit(); // 拿最新的账，别人可能刚记了
  const el = $('#view-' + v);
  el.classList.remove('view-enter'); void el.offsetWidth; el.classList.add('view-enter');
  window.scrollTo({ top: 0 });
  if (v === 'hunt') { mapKey = ''; renderMap(mapList); } // 地图藏着的时候量不到尺寸，回来重新取景
}

function switchTrip(k){
  if (k === trip) return;
  trip = k; T = TRIPS[k]; filter = 'all';
  if (reorderTimer) { clearTimeout(reorderTimer); reorderTimer = null; } // 别让上一页投票后的重排画到新标签页
  syncHash();
  STATE = { ...STATE, listings: [] }; // 账本是全员共用的，切行程不用清
  $('#grid').innerHTML = ''; $('#countLbl').textContent = ''; $('#addMsg').textContent = '';
  renderTrip();
  refresh();
}

async function refresh(){
  const t = trip;
  const s = await api('/api/state?trip=' + t);
  if (t !== trip) return; // 等待期间切了标签页，丢掉旧结果
  STATE = s; render(); renderSplit(); enrichMissing(); refreshPrices();
}
// 让后端去 Airbnb 查过期（>6 小时）的实时价，查回来再画一遍
async function refreshPrices(){
  const t = trip;
  let r;
  try { r = await api('/api/prices', 'POST', { trip: t }); } catch(e) { return; }
  if (t !== trip || !r.ok || !r.updated) return;
  STATE.listings.forEach(l => { if (r.live[l.id]) l.live = r.live[l.id]; });
  render();
}

async function enrichMissing(){
  const t = trip;
  for (const l of STATE.listings) {
    if (t !== trip) return;
    if (!l.image || l.rating == null || !l.images || l.images.length < 2 || !('lat' in l)) {
      try { const r = await api('/api/enrich', 'POST', { trip: t, id: l.id }); if (t === trip && r.ok && r.listing) { const i = STATE.listings.findIndex(x => x.id === l.id); if (i >= 0) STATE.listings[i] = r.listing; render(); } } catch(e){}
    }
  }
}

// ---------- 登录：从后端的用户列表里选名字 ----------
let USERS = [];
let pendingFn = null;
async function loadUsers(){
  try { const r = await api('/api/users'); if (r.ok) USERS = r.users; } catch(e){}
  renderUserSel(); renderSplit();
}
function renderUserSel(){
  $('#pickBox').hidden = !USERS.length;
  $('#userSel').innerHTML = '<option value="">选择你的名字…</option>'
    + USERS.map(u => '<option' + (u.name === myName ? ' selected' : '') + '>' + esc(u.name) + '</option>').join('');
}
function renderAccount(){
  const ini = myName ? esc(Array.from(myName)[0].toUpperCase()) : '?';
  $('#accountBtn').innerHTML = '<span class="avatar w-7 h-7 text-xs">' + ini + '</span>'
    + '<span class="max-w-[8rem] truncate">' + (myName ? esc(myName) : '登录') + '</span>';
  $('#accountBtn').title = myName ? '切换用户' : '登录';
}
function openLogin(fn){
  pendingFn = fn || null;
  $('#loginMsg').textContent = ''; $('#nameInput').value = '';
  renderUserSel();
  $('#nameModal').classList.add('open');
  (USERS.length ? $('#userSel') : $('#nameInput')).focus();
  loadUsers(); // 别人可能刚注册，顺手刷新一下列表
}
function ensureNameThen(fn){ if (myName) fn(); else openLogin(fn); }
async function login(name){
  name = name.trim();
  if (!name) return;
  $('#loginMsg').textContent = '';
  let r;
  try { r = await api('/api/login', 'POST', { name, token: myToken }); } catch(e) { r = { ok: false, error: '网络有点问题，稍后再试' }; }
  if (!r.ok) { $('#loginMsg').textContent = r.error || '登录失败'; return; }
  myName = r.user.name; myToken = r.user.token; USERS = r.users;
  localStorage.setItem('vn', myName); localStorage.setItem('vt', myToken);
  $('#nameModal').classList.remove('open');
  renderAccount(); render(); renderSplit(); refresh();
  if (pendingFn) { const f = pendingFn; pendingFn = null; f(); }
}
$('#pickOk').onclick = () => login($('#userSel').value);
$('#userSel').onchange = e => { if (e.target.value) login(e.target.value); };
$('#nameOk').onclick = () => login($('#nameInput').value);
$('#nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(e.target.value); });
$('#loginSkip').onclick = () => { pendingFn = null; $('#nameModal').classList.remove('open'); };
$('#accountBtn').onclick = () => openLogin();
renderAccount();
Promise.all([loadUsers(), splashDone]).then(() => { if (!myName) openLogin(); });

async function doVote(id){
  const l = STATE.listings.find(x => x.id === id);
  const voted = (l.votes || []).some(v => v.token === myToken);
  if (voted) {
    const r = await api('/api/vote', 'POST', { trip, id, token: myToken, name: null });
    if (r.ok) afterVote(id, r.votes); // 切了标签页就找不到这间，afterVote 会忽略
  } else {
    const t = trip;
    ensureNameThen(async () => {
      const r = await api('/api/vote', 'POST', { trip: t, id, token: myToken, name: myName });
      if (r.ok) { afterVote(id, r.votes); celebrate(id); }
    });
  }
}

async function removeListing(id){
  const l = STATE.listings.find(x => x.id === id);
  if (!l) return;
  if (!confirm('确定要删除「' + (l.title || '未命名房源') + '」吗？删掉后大家就看不到了。')) return;
  const r = await api('/api/remove', 'POST', { trip, id });
  if (r.ok) await refresh(); else alert('删除失败，稍后再试');
}

async function addListing(){
  const url = $('#urlInput').value.trim();
  if (!url) return;
  const btn = $('#addBtn'); btn.disabled = true; btn.textContent = '抓取中…';
  $('#addMsg').textContent = '正在读取 Airbnb 房源信息…';
  try {
    const r = await api('/api/add', 'POST', { trip, url });
    if (r.ok) {
      $('#urlInput').value = '';
      $('#addMsg').textContent = r.deduped ? '这间已经在清单里了' : '已加入清单 🎉';
      $('#addMsg').className = 'text-sm mt-2 text-green-600';
      await refresh();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      $('#addMsg').textContent = '自动抓取失败：' + (r.error || '未知错误') + '，可以用下面的手动添加';
      $('#addMsg').className = 'text-sm mt-2 text-amber-600';
      $('#mUrl').value = url;
      $('#manualBox').open = true;
    }
  } catch(e) {
    $('#addMsg').textContent = '网络有点问题，稍后再试';
    $('#addMsg').className = 'text-sm mt-2 text-red-500';
  }
  btn.disabled = false; btn.textContent = '加入清单';
}
$('#addBtn').onclick = addListing;
$('#urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') addListing(); });

$('#manualBtn').onclick = async () => {
  const body = { trip, url: $('#mUrl').value.trim(), title: $('#mTitle').value.trim(), image: $('#mImage').value.trim(),
    priceUSD: $('#mPrice').value ? Number($('#mPrice').value) : null, priceNights: T.nights,
    bedrooms: $('#mBedrooms').value ? Number($('#mBedrooms').value) : null,
    beds: $('#mBeds').value ? Number($('#mBeds').value) : null,
    bathrooms: $('#mBaths').value ? Number($('#mBaths').value) : null,
    sleeps: $('#mSleeps').value ? Number($('#mSleeps').value) : null,
    area: $('#mArea').value, note: $('#mNote').value.trim() };
  if (!body.url || !body.title) { alert('链接和标题是必填的'); return; }
  const r = await api('/api/add-manual', 'POST', body);
  if (r.ok) { ['mUrl','mTitle','mImage','mPrice','mBedrooms','mBeds','mBaths','mSleeps','mNote'].forEach(id => $('#'+id).value=''); $('#manualBox').open = false; await refresh(); }
  else alert('添加失败：' + (r.error || ''));
};

// ---------- 分账 Splitwise ----------
function fmtMoney(cents){
  return '$' + (Math.abs(cents) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// 成员名单：全员共用的用户列表（登录、投票、分账都是这一份）+ 账里出现过的名字
function knownNames(){
  const out = [];
  const push = n => { n = String(n || '').trim(); if (n && !out.some(x => x.toLowerCase() === n.toLowerCase())) out.push(n); };
  USERS.forEach(u => push(u.name));
  push(myName);
  (STATE.expenses || []).forEach(e => { push(e.paidBy); (e.splitAmong || []).forEach(push); });
  return out;
}
function renderSplit(){
  const names = knownNames();
  $('#memberChips').innerHTML = names.length
    ? names.map(n => '<span class="chip">' + esc(n) + '</span>').join('')
    : '<span class="text-sm text-slate-400">还没有成员，先加上大家的名字（投过票的人会自动出现）</span>';
  const sel = $('#ePaidBy'); const prev = sel.value;
  sel.innerHTML = names.map(n => '<option' + ((prev ? n === prev : n === myName) ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
  const prevChecked = {};
  document.querySelectorAll('#eSplit input[type=checkbox]').forEach(c => { prevChecked[c.value] = c.checked; });
  $('#eSplit').innerHTML = names.length
    ? names.map(n => '<label class="inline-flex items-center gap-1 mr-3 mb-1 text-sm"><input type="checkbox" value="' + esc(n) + '"' + ((n in prevChecked) ? (prevChecked[n] ? ' checked' : '') : ' checked') + '> ' + esc(n) + '</label>').join('')
    : '<span class="text-sm text-slate-400">先加成员</span>';
  const bal = STATE.balances || {};
  const entries = Object.entries(bal).sort((a, b) => b[1] - a[1]);
  $('#balances').innerHTML = entries.length
    ? '<h3 class="font-bold mb-2">余额（+ 应收回 · − 应付出）</h3>' + entries.map(([n, c]) =>
        '<div class="flex justify-between border-b py-1.5 text-sm"><span>' + esc(n) + '</span><span class="font-medium '
        + (c > 0 ? 'text-emerald-600' : c < 0 ? 'text-rose-600' : 'text-slate-400') + '">'
        + (c === 0 ? '已结清' : (c > 0 ? '+' : '−') + fmtMoney(c)) + '</span></div>').join('')
    : '';
  const st = STATE.settlements || [];
  $('#settlements').innerHTML = st.length
    ? '<h3 class="font-bold mb-2">💸 这样结清最省事</h3>' + st.map(s => '<div class="text-sm py-1">' + esc(s.from) + ' 付给 ' + esc(s.to) + ' <b>' + fmtMoney(s.amountCents) + '</b></div>').join('')
    : (entries.length ? '<p class="text-sm text-emerald-600">大家已经结清了 🎉</p>' : '');
  const exps = STATE.expenses || [];
  readEditor(); // 重画前先把编辑框里没保存的内容存下来
  if (editingId && !exps.some(e => e.id === editingId)) { editingId = null; editDraft = null; } // 这笔被别人删了
  $('#expenses').innerHTML = exps.length
    ? '<h3 class="font-bold mb-2">支出记录</h3>' + exps.map(e =>
        '<div class="flex items-center gap-2 border-b py-2 text-sm' + (e.id === editingId ? ' bg-amber-50 -mx-2 px-2 rounded-t-lg' : '') + '"><div class="flex-1"><div>' + esc(e.description)
        + '</div><div class="text-slate-500 text-xs">' + esc(e.paidBy) + ' 付的 · 分摊给 ' + (e.splitAmong || []).map(esc).join('、')
        + '</div></div><div class="font-medium">' + fmtMoney(e.amountCents)
        + '</div><button onclick="editExpense(\'' + e.id + '\')" class="text-slate-400 hover:text-indigo-600 px-1" title="修改这笔">✎</button>'
        + '<button onclick="removeExpense(\'' + e.id + '\')" class="text-slate-400 hover:text-red-600 px-1" title="删除这笔">✕</button></div>'
        + (e.id === editingId ? editorHtml(names) : '')).join('')
    : '<p class="text-sm text-slate-400">还没有支出记录</p>';
}
function applySplitView(r){
  if (r.expenses) STATE.expenses = r.expenses;
  if (r.balances) STATE.balances = r.balances;
  if (r.settlements) STATE.settlements = r.settlements;
  if (r.users) { USERS = r.users; renderUserSel(); }
}
async function loadSplit(){
  try { const r = await api('/api/split'); if (r.ok) { applySplitView(r); renderSplit(); } } catch(e){}
}
// 加成员 = 加进全员共用的用户列表，之后登录时直接选名字
async function addMember(){
  const v = $('#memberInput').value.trim();
  if (!v) return;
  const r = await api('/api/member', 'POST', { name: v });
  if (r.ok) { $('#memberInput').value = ''; applySplitView(r); renderSplit(); }
  else alert('添加失败：' + (r.error || ''));
}
async function addExpense(){
  const splitAmong = [...document.querySelectorAll('#eSplit input[type=checkbox]:checked')].map(c => c.value);
  const amountUSD = $('#eAmount').value ? Number($('#eAmount').value) : null;
  if (!amountUSD) { $('#eMsg').textContent = '先填金额'; return; }
  if (!$('#ePaidBy').value) { $('#eMsg').textContent = '先加成员并选择付款人'; return; }
  const r = await api('/api/expense', 'POST', { description: $('#eDesc').value.trim(), amountUSD, paidBy: $('#ePaidBy').value, splitAmong });
  if (r.ok) { $('#eDesc').value = ''; $('#eAmount').value = ''; $('#eMsg').textContent = '记上了 ✅'; applySplitView(r); renderSplit(); }
  else $('#eMsg').textContent = r.error || '记账失败';
}
// ---- 修改一笔：编辑框直接展开在这一行下面 ----
function editorHtml(names){
  const d = editDraft, on = d.checked.map(n => n.toLowerCase());
  return '<div id="editBox" class="bg-amber-50 -mx-2 px-2 pb-3 pt-1 mb-1 rounded-b-lg text-sm"'
    + ' onkeydown="if (event.key === \'Enter\') saveEdit(); else if (event.key === \'Escape\') cancelEdit();">'
    + '<div class="grid md:grid-cols-3 gap-2 mb-2">'
    + '<input id="editDesc" class="border rounded-lg px-3 py-2 bg-white" placeholder="支出说明" value="' + esc(d.desc) + '">'
    + '<input id="editAmount" type="number" step="0.01" min="0" class="border rounded-lg px-3 py-2 bg-white" placeholder="金额 USD" value="' + esc(d.amount) + '">'
    + '<select id="editPaidBy" class="border rounded-lg px-3 py-2 bg-white">'
    + names.map(n => '<option' + (n.toLowerCase() === d.paidBy.toLowerCase() ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select>'
    + '</div><div class="mb-2"><span class="font-medium mr-2">分摊给</span>'
    + names.map(n => '<label class="inline-flex items-center gap-1 mr-3 mb-1"><input type="checkbox" value="' + esc(n) + '"' + (on.includes(n.toLowerCase()) ? ' checked' : '') + '> ' + esc(n) + '</label>').join('')
    + '</div><button onclick="saveEdit()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl px-4 py-1.5">保存修改</button>'
    + '<button onclick="cancelEdit()" class="border-2 border-slate-200 hover:border-slate-400 bg-white text-slate-600 rounded-xl px-4 py-1 ml-2">取消</button>'
    + '<span id="editMsg" class="ml-3 text-rose-600"></span></div>';
}
function readEditor(){
  if (!editingId || !$('#editBox')) return;
  editDraft = { desc: $('#editDesc').value, amount: $('#editAmount').value, paidBy: $('#editPaidBy').value,
    checked: [...document.querySelectorAll('#editBox input[type=checkbox]:checked')].map(c => c.value) };
}
function editExpense(id){
  const e = (STATE.expenses || []).find(x => x.id === id);
  if (!e) return;
  editingId = id;
  editDraft = { desc: e.description, amount: String(e.amountCents / 100), paidBy: e.paidBy, checked: e.splitAmong || [] };
  $('#editBox')?.remove(); // 换一笔改：上一笔没保存的不要了
  renderSplit();
  $('#editBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  $('#editAmount').focus({ preventScroll: true });
}
function cancelEdit(){ editingId = null; editDraft = null; renderSplit(); }
async function saveEdit(){
  readEditor();
  const d = editDraft;
  const amountUSD = d.amount ? Number(d.amount) : null;
  if (!amountUSD) { $('#editMsg').textContent = '先填金额'; return; }
  const r = await api('/api/expense-update', 'POST', { id: editingId, description: d.desc.trim(), amountUSD, paidBy: d.paidBy, splitAmong: d.checked });
  if (r.ok) { editingId = null; editDraft = null; applySplitView(r); renderSplit(); }
  else if (r.error === '支出不存在') { editingId = null; editDraft = null; loadSplit(); alert('这笔已经被别人删掉了'); }
  else $('#editMsg').textContent = r.error || '修改失败';
}
async function removeExpense(id){
  if (!confirm('删除这笔支出？')) return;
  const r = await api('/api/expense-remove', 'POST', { id });
  if (r.ok) { applySplitView(r); renderSplit(); } else alert('删除失败，稍后再试');
}
// 卡片上的「用这间分账」：把房源标题和总价预填进分账表单
function splitListing(id){
  const l = STATE.listings.find(x => x.id === id);
  if (!l) return;
  $('#eDesc').value = l.title || '房费';
  if (l.priceUSD) $('#eAmount').value = l.priceUSD;
  switchView('split');
  $('#eAmount').focus({ preventScroll: true });
}
$('#memberBtn').onclick = addMember;
$('#memberInput').addEventListener('keydown', e => { if (e.key === 'Enter') addMember(); });
$('#eAddBtn').onclick = addExpense;

// 筛选按钮和标签页都是动态生成的，用事件委托
$('#filters').onclick = e => {
  const b = e.target.closest('.filter-chip');
  if (!b) return;
  document.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); filter = b.dataset.f; render();
};
$('#tabs').onclick = e => { const b = e.target.closest('.trip-tab'); if (b) switchTrip(b.dataset.trip); };
$('#mapToggle').onclick = toggleMap;
// 鼠标停在卡片上时，地图上对应的钉子跟着高亮
let hotId = null;
$('#grid').addEventListener('mouseover', e => {
  const a = e.target.closest('article[data-id]'); const id = a ? a.dataset.id : null;
  if (id === hotId) return;
  if (hotId) setHot(hotId, false);
  hotId = id; if (id) setHot(id, true);
});
$('#grid').addEventListener('mouseleave', () => { if (hotId) setHot(hotId, false); hotId = null; });
$('#sortSel').onchange = e => { sortBy = e.target.value; render(); };

document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => switchView(b.dataset.view));

renderNav();
renderTrip();
refresh();
</script>
