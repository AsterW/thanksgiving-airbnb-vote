name = "denver-thanksgiving-airbnb-vote"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# `wrangler deploy` / `wrangler dev` build the React frontend into ./dist first.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "VOTES_KV"
id = "0c1964118e4c427aa9698fa13a5dcadf"

# Blackjack table: one Durable Object (SQLite storage, required on the free plan).
[[durable_objects.bindings]]
name = "BJ_TABLE"
class_name = "BlackjackTable"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BlackjackTable"]

# 斗地主 room: one Durable Object (DdzHall) holding three tables.
[[durable_objects.bindings]]
name = "DDZ_HALL"
class_name = "DdzHall"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DdzHall"]

# 掼蛋 and 川麻 rooms: one Durable Object each, three tables of four.
[[durable_objects.bindings]]
name = "GD_HALL"
class_name = "GuandanHall"

[[durable_objects.bindings]]
name = "MJ_HALL"
class_name = "MahjongHall"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["GuandanHall", "MahjongHall"]

# The storekeeper: one Durable Object (StoreDO) owning every mutable
# app document, so concurrent writes serialize instead of overwriting
# each other (KV has no locks; see worker/store/store.js).
[[durable_objects.bindings]]
name = "STORE"
class_name = "StoreDO"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["StoreDO"]

# 鲁班七号躲技能 leaderboard: one Durable Object that replays and keeps best runs.
[[durable_objects.bindings]]
name = "DODGE"
class_name = "DodgeBoard"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["DodgeBoard"]
